<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netflix Signup</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body>
    <div class="background">
      <div class="Header" style="padding: 25px 50px">
        <svg
          width="200"
          height="60"
          viewBox="0 0 200 60"
          xmlns="http://www.w3.org/2000/svg"
        >
          <text
            x="50%"
            y="50%"
            text-anchor="middle"
            dominant-baseline="middle"
            fill="#E50914"
            font-size="40"
            font-weight="700"
            letter-spacing="2"
            font-family="Arial Black, Helvetica, Arial, sans-serif"
          >
            NETFLIX
          </text>
        </svg>
      </div>

      <!-- Signup Box -->
      <div class="signup-box">
        <div class="signup">
          <div>
            <h1 class="h1">Sign Up</h1>

            <input
              type="text"
              class="NameInput input-elem"
              placeholder="Full Name"
            />

            <input type="email" class="Email input-elem" placeholder="Email" />

            <input
              type="password"
              class="Password input-elem"
              placeholder="Password"
            />
            <div class="agreement-container">
              <input type="checkbox" class="checkbox" />
              <span>
                I agree to the <span class="word">Terms</span> and
                <span class="word">Privacy Policy</span>
              </span>
            </div>

            <button class="create-btn btn">Create account</button>

            <div class="span">
              Already have an account? <span class="word">&nbsp;Sign in</span>
            </div>

            <div class="notice">
              This page is protected by Google reCAPTCHA to ensure you're not a
              bot.
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
