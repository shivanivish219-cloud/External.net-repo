<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netflix Signup</title>
    <link rel="stylesheet" href="external.css" />
  </head>
  <body>
    <div class="Background">
      <!-- Header
      <div class="Header" style="padding: 25px 50px">
        <svg width="150" height="50" viewBox="0 0 150 50">
          <text class="NETFLIX" x="75" y="36">NETFLIX</text>
        </svg>
      </div> -->

      <!-- Signup Box -->
      <div class="Signupbox">
        <div class="Signup">
          <div>
            <h1 class="h1">Sign Up</h1>

            <input type="text" class="NameInput" placeholder="Full Name" />

            <input type="email" class="Email" placeholder="Email" />

            <input type="password" class="Password" placeholder="Password" />

            <div class="Agreement">
              <input type="checkbox" class="checkbox" />
              <span>
                I agree to the <span class="word">Terms</span> and
                <span class="word">Privacy Policy</span>
              </span>
            </div>

            <button class="Button">Create account</button>

            <div class="span">
              Already have an account? <span class="word">&nbsp;Sign in</span>
            </div>

            <div class="notice">
              This page is protected by Google reCAPTCHA to ensure you're not a
              bot.
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
